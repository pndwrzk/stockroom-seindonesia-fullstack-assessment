services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  stockroom-api:
    build:
      context: ./stockroom-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./stockroom-api/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://stockroom:stockroom_dev_password@postgres:5432/stockroom?schema=public
    command: ["sh", "-c", "npx prisma db push && npx prisma db seed && npm start"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:3000"

  stockroom-web:
    build:
      context: ./stockroom-web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - stockroom-api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
